name: Windows Desktop Release

on:
  push:
    branches: [main]
    paths:
      - crates/vnweb-desktop/tauri.conf.json

permissions:
  contents: read

jobs:
  check-version:
    name: Check for a Tauri version change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.desktop-version.outputs.version }}
      changed: ${{ steps.desktop-version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare Tauri versions
        id: desktop-version
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $path = 'crates/vnweb-desktop/tauri.conf.json'
          $config = Get-Content -LiteralPath $path -Raw -Encoding utf8 | ConvertFrom-Json
          $version = $config.version
          if ($version -cnotmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw 'Expected a version number in the Tauri configuration.'
          }

          $changed = $false
          if ($env:BEFORE_SHA -ne '0000000000000000000000000000000000000000') {
            $previousJson = git show "${env:BEFORE_SHA}:$path"
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not read the Tauri configuration before this push.'
            }
            $previousVersion = ($previousJson | Out-String | ConvertFrom-Json).version
            $changed = $version -cne $previousVersion
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "changed=$($changed.ToString().ToLowerInvariant())" -Encoding utf8

  build:
    name: Build Windows x64 installer
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-2025
    concurrency:
      group: desktop-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: x64
          cache: npm

      - name: Set up Rust for Windows x64
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        env:
          NEXT_PUBLIC_VNWEB_DESKTOP_BUILD: ${{ github.run_number }}
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: vnweb-windows-x64
          path: target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vnweb-windows-x64
          path: installer

      - name: Publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: desktop-build-${{ github.run_number }}
          RELEASE_TITLE: v${{ needs.check-version.outputs.version }}
          TAURI_VERSION: ${{ needs.check-version.outputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          main_version="$(gh api "repos/$GH_REPO/contents/crates/vnweb-desktop/tauri.conf.json?ref=main" \
            --jq '.content | gsub("\\s"; "") | @base64d | fromjson | .version')"
          if [[ "$main_version" != "$TAURI_VERSION" ]]; then
            echo "The Tauri version on main has changed. Skipping release of $GITHUB_SHA."
            exit 0
          fi

          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" == false ]]; then
              echo "$RELEASE_TAG is already published."
              exit 0
            fi
          fi

          commit_line='| "- [" + .sha[0:7] + "](" + .html_url + ") " + (.commit.message | split("\n")[0])'
          commit_notes=''
          if [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if ! commit_notes="$(gh api --paginate "repos/$GH_REPO/compare/$BEFORE_SHA...$GITHUB_SHA?per_page=100" \
              --jq ".commits[] $commit_line")"; then
              echo "Cannot compare push commits. Using the commit at $GITHUB_SHA."
              commit_notes=''
            fi
          fi
          if [[ -z "$commit_notes" ]]; then
            commit_notes="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq ". $commit_line")"
          fi
          printf 'Windows x64 NSIS installer\n\n## Commits\n\n%s\n' "$commit_notes" > release-notes.md

          if [[ "$is_draft" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" installer/*_x64-setup.exe --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --draft=false --latest=true --notes-file release-notes.md
